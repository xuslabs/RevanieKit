name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test (macOS)
        run: swift test
      - name: Build (iOS)
        run: xcodebuild -scheme RevanieKit -destination "generic/platform=iOS" build
